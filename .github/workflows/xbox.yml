name: Xbox Series (UWP) build

on:
  push:
    branches: [ xbox, 'xbox-*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uwp:
    runs-on: windows-2022
    env:
      SDL_VERSION: 2.32.10
      HLSDK_REPO: https://github.com/HavocMasterChief/hlsdk-portable-xbox
      HLSDK_BRANCH: xbox
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build package
      id: build
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        & ./scripts/gha/build_uwp.ps1 *>&1 | Tee-Object -FilePath build-log.txt
        $ok = $?
        if (-not (Test-Path artifacts/Xash3DXbox-x64.zip)) { $ok = $false }
        "ok=$ok" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        if (-not $ok) { exit 1 }

    - name: Upload package
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Xash3DXbox-x64
        path: artifacts/Xash3DXbox-x64.zip

    - name: Publish release (xbox-latest)
      if: success()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # xbox -> xbox-latest; experimental branches (xbox-gl, ...) get their own release
        TAG="${GITHUB_REF_NAME}-latest"
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" artifacts/Xash3DXbox-x64.zip \
          --target "$GITHUB_SHA" --prerelease \
          --title "Xbox Series Dev Mode build #$GITHUB_RUN_NUMBER ($GITHUB_REF_NAME)" \
          --notes "Automatic build of the $GITHUB_REF_NAME branch at $GITHUB_SHA. See README-XBOX.md inside the zip for install steps."

    # Build logs go to the ci-logs branch so they can be read without
    # access to the Actions UI. The branch only ever holds the latest run.
    - name: Publish build log
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RESULT: ${{ job.status }}
      run: |
        mkdir -p ci-logs-out
        if [ -f build-log.txt ]; then cp build-log.txt ci-logs-out/build-log.txt; else echo "no log produced" > ci-logs-out/build-log.txt; fi
        grep -nE "error [A-Z]+[0-9]+|: error|fatal error|FAILED|LNK[0-9]{4}|Exception" build-log.txt > ci-logs-out/errors.txt 2>/dev/null || true
        printf 'sha=%s\nrun=%s\nresult=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$RESULT" > ci-logs-out/status.txt
        cd ci-logs-out
        git init -q -b ci-logs
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add -A
        git commit -qm "Build log for $GITHUB_SHA (run $GITHUB_RUN_NUMBER)"
        git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
