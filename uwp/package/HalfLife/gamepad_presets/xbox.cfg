// Xbox Series Dev Mode build: same layout as xash-extras, B goes through +xbcrouch for toggle crouch
// Follows steam_controller_2026.cfg, minus trackpads
joy_unbindall

// face buttons
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+xbcrouch" // Xbox build: hold or toggle (Controller menu)
bind "X_BUTTON" "+use"
bind "Y_BUTTON" "+reload"

// bumpers
bind "L1_BUTTON" "+xbwheel" // hold: weapon wheel
bind "R1_BUTTON" "+xbgrenade" // hold: grenade ready, release: throw. Weapon wheel cancels

// triggers
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"

// back paddles on Elite and some third party controllers. SDL orders them right hand first,
// so PADDLE1 is upper right, PADDLE2 is upper left, PADDLE3 is lower right and PADDLE4 is lower left
bind "PADDLE1" "savequick"
bind "PADDLE2" "+jump"
bind "PADDLE3" "loadquick"
bind "PADDLE4" "+duck"

// dpad
bind "DPAD_UP" "+xbdpadup" // long jump; View + Up: quicksave
bind "DPAD_DOWN" "+xbdpaddown" // ally follow/wait; View + Down: quickload
bind "DPAD_LEFT" "+xbdpadleft" // quicksave; in the wheel: previous weapon in category
bind "DPAD_RIGHT" "+xbdpadright" // last weapon; in the wheel: next weapon in category

// joysticks clicks
// STICK1 (left stick click) is free
bind "STICK2" "xbkick" // kick, like RealRTCWX

bind "BACK" "+xbview" // tap: flashlight; hold with D-pad Up/Down: quicksave/quickload
bind "START" "cancelselect"

joy_axis_binding "sfpyrl"
joy_touchpad_right_mode off
joy_touchpad_left_mode off
